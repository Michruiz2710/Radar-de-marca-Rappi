# CI: corre en cada PR hacia main y en cada push a main.
# No usa secretos ni internet en las pruebas.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si subes otro commit al mismo PR, cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas y lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Misma versión de Python que los Dockerfiles
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.12.12

      - name: Lint (ruff)
        run: make lint

      - name: Pruebas (pytest)
        run: make test

  imagenes:
    name: Build ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Si falla una imagen, las demás siguen para ver todos los errores juntos
      fail-fast: false
      matrix:
        include:
          - nombre: scraper-news
            dockerfile: src/ingestion/news/Dockerfile
          - nombre: scraper-youtube
            dockerfile: src/ingestion/youtube/Dockerfile
          - nombre: scraper-google-play
            dockerfile: src/ingestion/google_play/Dockerfile
          - nombre: orquestador
            dockerfile: flows/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Se construye desde la raíz del repo, igual que en el docker-compose
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

  calidad:
    name: Validaciones de calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # P2.2 (Katalina) define el comando. Mientras no exista, no bloquea el PR.
      - name: Validaciones (make validar)
        run: |
          if make -n validar > /dev/null 2>&1; then
            make validar
          else
            echo "::notice::Todavía no existe 'make validar' (P2.2). Se omite este paso."
          fi

  dbt:
    name: Modelos dbt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres de prueba con 9 menciones inventadas (dbt/datos_ci.py), cargadas con el mismo código
    # de P2.3 y P2.4. dbt build crea analytics y corre las pruebas, y al final se revisan resultados conocidos.
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d radar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: radar
      PG_SCHEMA_CLEAN: clean
      PG_SCHEMA_ANALYTICS: analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dbt/requirements-dbt.txt

      - name: Cargar datos de prueba en clean
        run: PYTHONPATH=. python dbt/datos_ci.py

      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Revisar resultados conocidos
        run: PYTHONPATH=. python dbt/datos_ci.py --verificar
