# Carga los dashboards de infra/grafana/dashboards al arrancar Grafana (P3.2).
apiVersion: 1

providers:
  - name: radar
    folder: Radar Rappi
    type: file
    # Los dashboards son código: no se pueden borrar desde la interfaz
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
