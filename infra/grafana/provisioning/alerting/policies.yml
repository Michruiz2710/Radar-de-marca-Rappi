# A quién y con qué rapidez se avisa (P3.2).
# Las P0 salen de inmediato y se repiten cada hora mientras sigan activas;
# las P1 esperan un poco y se repiten cada 12 horas.
apiVersion: 1

policies:
  - orgId: 1
    receiver: correo-grupo
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: correo-grupo
        object_matchers:
          - [severidad, "=", P0]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1h
      - receiver: correo-grupo
        object_matchers:
          - [severidad, "=", P1]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
